<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilePath</title>
</head>

<body style="font-size:35px; font-family:sans-serif;">

    <!-- Absolute File Path -->

    <h1 style="font-size:35px;font-family:'Gill Sans','Gill Sans MT',Calibri,'Trebuchet MS',sans-serif;">
        Absolute FilePath
    </h1>

    <div style="width:100%;height:230px;background-color:lightblue;">

        <!-- Family Image -->
        <img style="width:16%;height:100%;"
             src="D:\WebDevelopment_M15\html\file_path\family\FamilyImage.png"
             alt="FamilyImage">

        <!-- Grand Father Image -->
        <img style="width:16%;height:100%;"
             src="D:\WebDevelopment_M15\html\file_path\family\grand_father\gf.jpg"
             alt="GrandFatherImage">

        <!-- Father Image -->
        <img style="width:16%;height:100%;"
             src="D:\WebDevelopment_M15\html\file_path\family\grand_father\father\FatherImage.png"
             alt="FatherImage">

        <!-- Your Image -->
        <img style="width:16%;height:100%;"
             src="D:\WebDevelopment_M15\html\file_path\family\grand_father\father\your_folder\your_image.png"
             alt="YourImage">

        <img style="width:16%;height:100%;"
             src="D:\WebDevelopment_M15\html\file_path\family\grand_father\father\your_folder\child\child.png"
             alt="Child Image">

        <img style="width:16%;height:100%;"
             src="D:\WebDevelopment_M15\html\file_path\family\grand_father\father\your_folder\child\grand_child\grandchild.jpg"
             alt="GrandChildImage">

    </div>

    <br><br>

    <!-- Relative File Path -->

    <h1 style="font-size:35px;font-family:'Gill Sans','Gill Sans MT',Calibri,'Trebuchet MS',sans-serif;">
        Relative FilePath
    </h1>

    <div style="width:100%;height:230px;background-color:lightblue;">

        <!-- Family Image -->
        <img style="width:16%;height:100%;"
             src="../../../FamilyImage.png"
             alt="FamilyImage">

        <!-- Grand Father Image -->
        <img style="width:16%;height:100%;"
             src="../../gf.jpg"
             alt="GrandFatherImage">

        <!-- Father Image -->
        <img style="width:16%;height:100%;"
             src="../FatherImage.png"
             alt="FatherImage">

        <!-- Your Image -->
        <img style="width:16%;height:100%;"
             src="your_image.png"
             alt="YourImage">

        <img style="width:16%;height:100%;"
             src="child/child.png"
             alt="YourImage">

        <img style="width:16%;height:100%;"
             src="child/grand_child/grandchild.jpg"
             alt="YourImage">

    </div>

</body>
</html>
