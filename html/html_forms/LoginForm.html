<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
</head>

<body style="font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">

    <form action="https://www.facebook.com" target="myframe">

        <table >

            <caption style="font-size:60px; font-weight:bold; ">
                LoginForm
            </caption>

            <tr>
                <td style="font-size:30px;">
                    <label>Username</label>
                </td>

                <td>
                    <input
                        type="text"
                        
                        style="
                        width:400px;
                        height:45px;
                        font-size:22px;
                        border:none;
                        outline:none;
                        background-color:lightgray;
                        border-radius:8px;
                        ">
                </td>
            </tr>

            <tr>
                <td style="font-size:30px;">
                    <label>Password</label>
                </td>

                <td>
                    <input
                        type="password"
                        
                        style="
                        width:400px;
                        height:45px;
                        font-size:22px;
                        border:none;
                        outline:none;
                        background-color:lightgray;
                        border-radius:8px;
                        ">
                </td>
            </tr>

            <tr>
                <td>
                    <input
                        type="submit"
                        value="Login"
                        style="
                        width:180px;
                        height:55px;
                        font-size:28px;
                        color:white;
                        background-color:royalblue;
                        border:none;
                        border-radius:12px;
                        cursor:pointer;">
                </td>

                <td>
                    <input
                        type="button"
                        value="Register"
                        style="
                        width:180px;
                        height:55px;
                        font-size:28px;
                        color:white;
                        background-color:green;
                        border:none;
                        border-radius:12px;
                        cursor:pointer;">

                    

                    <input
                        type="reset"
                        value="Cancel"
                        style="
                        width:180px;
                        height:55px;
                        font-size:28px;
                        color:white;
                        background-color:red;
                        border:none;
                        border-radius:12px;
                        cursor:pointer;">
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
