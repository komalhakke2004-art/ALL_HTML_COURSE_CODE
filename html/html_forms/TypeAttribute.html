<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeAttribute</title>
</head>

<body>
    <form action="">
        <!-- table inside html forms -->
        <table>
            <!-- form table caption -->
            <caption
                style="font-size: 50px;font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;font-weight: bold;">
                HTMLForms[type attribute]</caption>
            <!-- form table body -->
            <tbody style="font-size: 35px;font-family: sans-serif;">
                <!-- form table body rows -->
                <!-- first row -->
                <tr>
                    <td><label for="">Username</label></td>
                    <td><input type="text"
                            style="outline: none;border: none;font-size: 35px;width: 350px;height: 45px;background-color: lightgray;border-radius: 5px;" />
                    </td>
                </tr>
                <!-- second row -->
                <tr>
                    <td><label for="">Password</label></td>
                    <td><input type="password"
                            style="outline: none;border: none;font-size: 35px;width: 350px;height: 45px;background-color: lightgray;border-radius: 5px;" />
                    </td>
                </tr>
                <!-- third row -->
                <tr>
                    <td><label for="">Age</label></td>
                    <td><input type="number"
                            style="outline: none;border: none;font-size: 35px;width: 350px;height: 45px;background-color: lightgray;border-radius: 5px;" />
                    </td>
                </tr>
                <!-- fourth row -->
                <tr>
                    <td><label for="">MobileNumber</label></td>
                    <td><input type="tel"
                            style="outline: none;border: none;font-size: 35px;width: 350px;height: 45px;background-color: lightgray;border-radius: 5px;" />
                    </td>
                </tr>
                <!-- fifth row -->
                <tr>
                    <td><label for="">EmailUsername</label></td>
                    <td><input type="email"
                            style="outline: none;border: none;font-size: 35px;width: 350px;height: 45px;background-color: lightgray;border-radius: 5px;" />
                    </td>
                </tr>
                <!-- sixth row -->
                <tr>
                    <td><label for="">ChooseColor</label></td>
                    <td><input type="color"
                            style="outline: none;border: none;font-size: 35px;width: 350px;height: 45px;background-color: lightgray;border-radius: 5px;" />
                    </td>
                </tr>
                <!-- seventh row -->
                <tr>
                    <td><label for="">Brightness</label></td>
                    <td><input type="range"
                            style="outline: none;border: none;font-size: 35px;width: 350px;height: 45px;background-color: lightgray;border-radius: 5px;" />
                    </td>
                </tr>
                <!-- eight row -->
                <tr>
                    <td><label for="">Date</label></td>
                    <td><input type="date"
                            style="outline: none;border: none;font-size: 35px;width: 350px;height: 45px;background-color: lightgray;border-radius: 5px;" />
                    </td>
                </tr>
                <!-- nineth row -->
                <tr>
                    <td><label for="">Time</label></td>
                    <td><input type="time"
                            style="outline: none;border: none;font-size: 35px;width: 350px;height: 45px;background-color: lightgray;border-radius: 5px;" />
                    </td>
                </tr>
                <!-- tenth row -->
                <tr>
                    <td><label for="">DateAndTime</label></td>
                    <td><input type="datetime-local"
                            style="outline: none;border: none;font-size: 35px;width: 350px;height: 45px;background-color: lightgray;border-radius: 5px;" />
                    </td>
                </tr>
                <!-- eleventh row -->
                <tr>
                    <td><label for="">Month</label></td>
                    <td><input type="month"
                            style="outline: none;border: none;font-size: 35px;width: 350px;height: 45px;background-color: lightgray;border-radius: 5px;" />
                    </td>
                </tr>
                <!-- twelveth row -->
                <tr>
                    <td><label for="">Week</label></td>
                    <td><input type="week"
                            style="outline: none;border: none;font-size: 35px;width: 350px;height: 45px;background-color: lightgray;border-radius: 5px;" />
                    </td>
                </tr>
                <!-- thirteenth row -->
                <tr>
                    <td><label for="">Search</label></td>
                    <td><input type="search"
                            style="outline: none;border: none;font-size: 35px;width: 350px;height: 45px;background-color: lightgray;border-radius: 5px;" />
                    </td>
                </tr>
                <!-- fourteenth row -->
                <tr>
                    <td><label for="">UploadFile</label></td>
                    <td><input type="file"
                            style="outline: none;border: none;font-size: 35px;width: 500px;height: 50px;border-radius: 5px;" />
                    </td>
                </tr>
                <!-- fifteenth row -->
                <tr>
                    <td><label for="">Gender</label></td>  
                    <td>
                        <input type="radio" name="gender" style="width: 25px;height: 25px;" /> <label
                            for="">Male</label>
                        <br />
                        <input type="radio" name="gender" style="width: 25px;height: 25px;" /> <label
                            for="">Female</label>
                        <br />
                        <input type="radio" name="gender" style="width: 25px;height: 25px;" /> <label
                            for="">TransGender</label>
                        <br />
                        <input type="radio" name="gender" style="width: 25px;height: 25px;" /> <label
                            for="">TransWomen</label>
                    </td>
                </tr>
                <!-- sixteenth row -->
                <tr>
                    <td><label for="">SkillsSet</label></td>
                    <td>
                        <input type="checkbox" name="skillsSet" style="width: 25px;height: 25px;" /> <label
                            for="">HTML</label>
                        <br />
                        <input type="checkbox" name="skillsSet" style="width: 25px;height: 25px;" /> <label
                            for="">CSS</label>
                        <br />
                        <input type="checkbox" name="skillsSet" style="width: 25px;height: 25px;" /> <label
                            for="">JavaScript</label>
                        <br />
                        <input type="checkbox" name="skillsSet" style="width: 25px;height: 25px;" /> <label
                            for="">ReactJavaScript</label>
                    </td>
                </tr>
                <!-- last row -->
                <tr>
                    <td><input
                            style="font-size: 45px;outline: none;border: none;width: 150px;height: 55px;background-color: lightgray;border-radius: 10px;cursor: pointer;"
                            type="submit"></td>
                    <td><input
                            style="font-size: 45px;outline: none;border: none;width: 150px;height: 55px;background-color: lightgray;border-radius: 10px;cursor: pointer;"
                            type="reset"></td>
                </tr>
            </tbody>
        </table>
    </form>
</body>

</html>
