<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Norway Flag</title>
</head>
<body >

    <!-- Norway Flag Container -->
    <div style="width:100%; height:712px; background-color:navy;">

        <!-- Upper Left -->
        <div style="width:29.41%; height:41.67%; background-color:white; float:left;">
            <div style="width:80%; height:80%; background-color:red;"></div>
        </div>

        <!-- Upper Right -->
        <div style="width:58.82%; height:41.67%; background-color:white; float:right;">
            <div style="width:90%; height:80%; background-color:red; float:right;"></div>
        </div>

        <!-- Horizontal Blue Cross -->
        <div style="width:100%; height:16.66%; float:left;"></div>

        <!-- Lower Left -->
        <div style="width:29.41%; height:41.67%; background-color:white; float:left;">
            <div style="width:100%; height:20%;"></div>
            <div style="width:80%; height:80%; background-color:red;"></div>
        </div>

        <!-- Lower Right -->
        <div style="width:58.82%; height:41.67%; background-color:white; float:right;">
            <div style="width:100%; height:20%;"></div>
            <div style="width:90%; height:80%; background-color:red; float:right;"></div>
        </div>

    </div>

</body>
</html>
