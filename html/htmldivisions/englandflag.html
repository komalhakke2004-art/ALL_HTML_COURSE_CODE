<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>England Flag</title>
</head>
<body>

    <!-- England Flag Container -->
    <div style="width:100%; height:700px; background-color:red;">

        <!-- Top Left -->
        <div style="width:45%; height:280px; background-color:white; float:left;"></div>

        <!-- Top Right -->
        <div style="width:45%; height:280px; background-color:white; float:right;"></div>

        <!-- Horizontal Red Cross -->
        <div style="width:100%; height:140px; float:left;"></div>

        <!-- Bottom Left -->
        <div style="width:45%; height:280px; background-color:white; float:left;"></div>

        <!-- Bottom Right -->
        <div style="width:45%; height:280px; background-color:white; float:right;"></div>

    </div>

</body>
</html>
