<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultipleBlockcontainer</title>
</head>
<body>
    <div style=" width:100%;height: 712px;font-size: 50px;font-family: sans-serif;text-align: center;background-color: gray;">
    <!-- multiple blocks -->
    <!-- header block-->
    <div style="width: 100%;height: 20%;background-color: peachpuff;">Header</div>
    <!--Aside block-->
    <div style="width: 20%;height: 60%;float: left;">
       <div style="width: 100%;height: 50%;background-color: lightblue;">Aside1</div>
       <div style="width: 100%;height: 50%;background-color: navy;">Aside2</div>
    </div>
    <!--div block-->
    <div style="width: 80%;height: 60%;float: right;">
        <div style="width: 25%;height: 33.3%;background-color: beige;float: left;">Done</div>
        <div style="width: 25%;height: 33.3%;background-color: palegoldenrod;float: left;">DTwo</div>
        <div style="width: 25%;height: 33.3%;background-color: burlywood;float: left;">DThree</div>
        <div style="width: 25%;height: 33.3%;background-color: brown;float: right;color: white;">DFour</div>
        <div style="width: 33.3%;height: 33.3%;background-color: orange;float: left;">DFive</div>
        <div style="width: 33.3%;height: 33.3%;background-color: white;float: left;">DSix</div>
        <div style="width: 33.3%;height: 33.3%;background-color: green;float: right;">DSeven</div>
        <div style="width: 20%;height: 33.3%;background-color: green;float: left;">DEight</div>
        <div style="width: 20%;height: 33.3%;background-color: white;float: left;">DNine</div>
        <div style="width: 20%;height: 33.3%;background-color: red;float: left;color: white;">DTen</div>
        <div style="width: 20%;height: 33.3%;background-color: navy;float: left;color: white;">DEleven</div>
        <div style="width: 20%;height: 33.3%;background-color: lightgray;float: right;">DTwelve</div>
    </div>
    <!--footer block-->
    <div style="width: 100%;height: 20%;background-color: black;float: left;color: white;">Footer</div>
    </div>

</body>
</html>
