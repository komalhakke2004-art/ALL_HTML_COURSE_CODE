<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMLDivisions</title>
</head>
<body>
    <!--content approach-->
    <div style="font-size: 35px;font-family: sans-serif;color: white;background-color: red;">
        FirstTextContent
        <br/>
        SecondTextContent
        <br/>
        ThirdTextContent
        
    </div>
    <br/>

    <div style="width: 100px;height: 100px;background-color:navy ;float: left;"></div>
    <div style="width: 100px;height: 100px;background-color: lightgray ;float: left;"></div>
    <div style="width: 100px;height: 100px;background-color: black;float: right;"></div>
    
</body>
</html>
