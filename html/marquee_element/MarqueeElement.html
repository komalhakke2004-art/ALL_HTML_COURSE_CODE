<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarqueeElement</title>
</head>
<body>
    <marquee behavior="scroll" direction="left" scrollamount="60" loop="5" style="font-size: 50px;font-family: sans-serif;background-color: lightgray;">
        ScrollableContent

    <marquee behavior="" direction="up" style="font-size: 35px;font-family: sans-serif;background-color: black;color: white;">
        WebDevelopment is the process of developing and designing front-end of the web pages by using HTML,CSS,JavaScript, ReactJavaScript and typescript.
    </marquee>
</body>
</html>
