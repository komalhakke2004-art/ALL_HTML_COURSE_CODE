<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex table</title>
</head>
<body>
    <center>
        <!--complex table-->
        <table style="width: 634px;height: 634px;">
            <!--complex table body-->
            <tbody style="background-color: navy;">
                <!--comple table body rows-->
            <!--first row-->
            <tr>
                <!--complex table body cells-->
                <td rowspan="3"></td>
                <td colspan="3"></td>
            </tr>
            <!--second row-->
            <tr>
                <!--complex table body cells-->
                <td colspan="2"></td>
                <td rowspan="2"></td>
            </tr>
            <!--third row-->
            <tr>
                <!--complex table body cells-->
                <td colspan="2"></td>
            </tr>
            <!--fourth row-->
            <tr>
                <!--complex table body cells-->
                <td rowspan="2"></td>
                <td rowspan="2"></td>
                <td rowspan="2"></td>
                <td></td>
            </tr>
            <!--fifth row-->
            <tr>
                <!--complex table body cells-->
                <td></td>
            </tr>
            <!--sixth row-->
            <tr>
                <!--complex table body cells-->
                <td rowspan="3"></td>
                <td colspan="2"></td>
                <td rowspan="3">
                    <!--complex inner table-->
                    <table style="width:100%;height: 100%;">
                        <!--complex inner table body-->
                        <tbody style="background-color: white;">
                            <!--complex inner table body rows-->
                            <!--first row-->
                            <tr>
                                <td></td>
                            </tr>
                            <!--second row-->
                            <tr>
                                <td></td>
                            </tr>
                            </tbody>
                         </table>
                     </td>
                 </tr>
                 <!--seventh row-->
                 <tr>
                    <!--complex table body cells-->
                    <td td colspan="2"></td>
                 </tr>
                 <!--eight row-->
                 <tr>
                    <!--complex table body cells-->
                    <td colspan="2"></td>
                 </tr>
                 <!--nineth row-->
                 <tr>
                    <!--complex table body cells-->
                    <td style="width: 20%;"></td>
                    <td style="width: 15%;"></td>
                    <td style="width: 15%"></td>
                    <td style="width: 50%;"></td>
                 </tr>
            </body>
        </table>
    </center>
</body>
</html>
